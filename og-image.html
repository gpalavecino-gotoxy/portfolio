<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chivo:wght@500&family=Piazzolla:opsz,wght@8..30,700&family=Spline+Sans+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: oklch(18% 0.012 70);
      font-family: 'Chivo', system-ui, sans-serif;
    }

    .bloom {
      position: absolute;
      width: 760px; height: 630px;
      top: -160px; right: -260px;
      background: radial-gradient(circle, oklch(45% 0.04 68 / 0.14) 0%, transparent 62%);
    }

    .content {
      position: relative; z-index: 1;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      padding-left: 110px;
      padding-right: 90px;
    }

    .accent-bar {
      position: absolute;
      left: 64px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 340px;
      background: oklch(80% 0.08 68);
      border-radius: 3px;
    }

    .text-group {
      display: flex;
      flex-direction: column;
      max-width: 1000px;
    }

    .name {
      font-family: 'Piazzolla', Georgia, serif;
      font-size: 92px;
      font-weight: 700;
      color: oklch(95% 0.008 80);
      letter-spacing: -0.005em;
      word-spacing: 0.05em;
      line-height: 1.02;
      margin-bottom: 24px;
    }

    .role {
      font-size: 34px;
      font-weight: 500;
      color: oklch(84% 0.010 80);
      letter-spacing: -0.01em;
      margin-bottom: 22px;
    }

    .tags {
      font-family: 'Spline Sans Mono', monospace;
      font-size: 24px;
      font-weight: 500;
      color: oklch(80% 0.08 68);
      letter-spacing: 0.01em;
    }

    .domain {
      position: absolute;
      right: 64px;
      bottom: 56px;
      font-family: 'Spline Sans Mono', monospace;
      font-size: 22px;
      color: oklch(77% 0.012 80);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="bloom"></div>
  <div class="accent-bar"></div>
  <div class="content">
    <div class="text-group">
      <div class="name">Gastón Palavecino</div>
      <div class="role">Senior Software Engineer</div>
      <div class="tags">.NET · AI Engineering · Full Stack</div>
    </div>
  </div>
  <div class="domain">gastonpalav.com.ar</div>
</body>
</html>
